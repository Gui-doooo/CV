title: "[Vorname N.]"
description: "[Jobtitel]"
author: "[Vorname Nachname]"
tagline: "[Jobtitel] · [Zusatz]"

# Must match repo name: https://<github-user>.github.io/<repo>/
url: "https://your-username.github.io"
baseurl: "/CV"

lang: de
markdown: kramdown
permalink: pretty

encoding: "utf-8"

remote_theme: fculpo/jekyll-theme-pillar

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

theme_skin: gray

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - _template-cv
  - vendor
  - vendor/bundle
  - .bundle
  - .jekyll-cache
  - .sass-cache
